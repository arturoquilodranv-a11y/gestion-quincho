<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Quincho</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200">
        <h1 class="text-3xl font-bold mb-6 text-center text-slate-800">Administración de Quincho</h1>
        
        <!-- Pestañas de Navegación -->
        <div class="flex border-b mb-6">
            <button id="tab-calendario" class="px-6 py-3 font-semibold text-blue-700 border-b-2 border-blue-700 focus:outline-none transition-colors">Calendario de Reservas</button>
            <button id="tab-socios" class="px-6 py-3 font-semibold text-slate-500 hover:text-blue-700 focus:outline-none transition-colors">Personal (Descuento Mensual)</button>
        </div>
        
        <!-- Vista Calendario -->
        <div id="view-calendario">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-700">Mes Actual</h2>
                <div class="flex gap-2 text-sm">
                    <span class="px-2 py-1 bg-green-500 text-white rounded">Personal Interno</span>
                    <span class="px-2 py-1 bg-blue-500 text-white rounded">Externo</span>
                </div>
            </div>
            
            <div class="grid grid-cols-7 gap-2 text-center font-bold mb-2 text-slate-600">
                <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
            <p class="text-sm text-slate-500 mt-4">* Haz clic en un día para agendar o cancelar una reserva.</p>
        </div>

        <!-- Vista Socios -->
        <div id="view-socios" class="hidden">
            <h2 class="text-xl font-bold mb-4 text-slate-700">Listado de Personal Activo</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="nuevo-socio" placeholder="Nombre completo del funcionario" class="border border-slate-300 p-3 flex-1 rounded focus:outline-none focus:border-blue-500">
                <button onclick="agregarSocio()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded font-semibold transition-colors">Agregar</button>
            </div>
            <div class="bg-slate-50 rounded border border-slate-200">
                <ul id="lista-socios" class="divide-y divide-slate-200"></ul>
            </div>
        </div>
    </div>

    <script>
        // Almacenamiento Local (Persistencia en navegador)
        let socios = JSON.parse(localStorage.getItem('quincho_socios')) || [];
        let reservas = JSON.parse(localStorage.getItem('quincho_reservas')) || {};

        // Control de Pestañas
        document.getElementById('tab-calendario').onclick = () => {
            document.getElementById('view-calendario').classList.remove('hidden');
            document.getElementById('view-socios').classList.add('hidden');
            document.getElementById('tab-calendario').classList.add('text-blue-700', 'border-b-2', 'border-blue-700');
            document.getElementById('tab-socios').classList.remove('text-blue-700', 'border-b-2', 'border-blue-700', 'text-slate-500');
            document.getElementById('tab-socios').classList.add('text-slate-500');
        };
        document.getElementById('tab-socios').onclick = () => {
            document.getElementById('view-socios').classList.remove('hidden');
            document.getElementById('view-calendario').classList.add('hidden');
            document.getElementById('tab-socios').classList.add('text-blue-700', 'border-b-2', 'border-blue-700');
            document.getElementById('tab-calendario').classList.remove('text-blue-700', 'border-b-2', 'border-blue-700', 'text-slate-500');
            document.getElementById('tab-calendario').classList.add('text-slate-500');
            renderSocios();
        };

        // Renderizar Calendario
        function renderCalendario() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            for(let i = 1; i <= 31; i++) {
                const diaDiv = document.createElement('div');
                diaDiv.className = 'border border-slate-200 rounded p-2 h-24 flex flex-col cursor-pointer hover:bg-blue-50 transition-colors bg-white shadow-sm';
                
                const header = document.createElement('div');
                header.className = 'font-bold text-slate-400 text-right text-sm mb-1';
                header.innerText = i;
                diaDiv.appendChild(header);
                
                if(reservas[i]) {
                    const res = document.createElement('div');
                    res.className = `text-xs p-1.5 rounded text-white font-semibold shadow-sm truncate ${reservas[i].tipo === 'interno' ? 'bg-green-500' : 'bg-blue-500'}`;
                    res.innerText = reservas[i].nombre;
                    diaDiv.appendChild(res);
                }
                
                diaDiv.onclick = () => reservarDia(i);
                grid.appendChild(diaDiv);
            }
        }

        function reservarDia(dia) {
            if(reservas[dia]) {
                if(confirm(`El día ${dia} está reservado por ${reservas[dia].nombre}. ¿Deseas eliminar la reserva?`)) {
                    delete reservas[dia];
                    localStorage.setItem('quincho_reservas', JSON.stringify(reservas));
                    renderCalendario();
                }
                return;
            }

            const nombre = prompt(`Agendar quincho para el día ${dia}.\nIngrese el nombre de quien reserva:`);
            if(nombre) {
                const esInterno = socios.some(s => s.toLowerCase().includes(nombre.toLowerCase())) || 
                                  confirm(`¿"${nombre}" es parte del personal con descuento mensual?\n\nAceptar = Sí (Verde)\nCancelar = No (Azul)`);
                reservas[dia] = { nombre, tipo: esInterno ? 'interno' : 'externo' };
                localStorage.setItem('quincho_reservas', JSON.stringify(reservas));
                renderCalendario();
            }
        }

        // Renderizar Socios
        function renderSocios() {
            const lista = document.getElementById('lista-socios');
            lista.innerHTML = '';
            if(socios.length === 0) {
                lista.innerHTML = '<li class="p-4 text-slate-500 text-center italic">No hay personal registrado aún.</li>';
                return;
            }
            socios.forEach((s, idx) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center p-4 hover:bg-slate-100 transition-colors';
                li.innerHTML = `
                    <span class="font-medium text-slate-700">${s}</span> 
                    <button onclick="borrarSocio(${idx})" class="text-red-500 text-sm font-semibold hover:text-red-700 bg-red-50 px-3 py-1 rounded">Eliminar</button>`;
                lista.appendChild(li);
            });
        }

        function agregarSocio() {
            const input = document.getElementById('nuevo-socio');
            if(input.value.trim()) {
                socios.push(input.value.trim());
                localStorage.setItem('quincho_socios', JSON.stringify(socios));
                input.value = '';
                renderSocios();
            }
        }

        function borrarSocio(idx) {
            if(confirm('¿Estás seguro de eliminar a esta persona del registro?')) {
                socios.splice(idx, 1);
                localStorage.setItem('quincho_socios', JSON.stringify(socios));
                renderSocios();
            }
        }

        // Iniciar
        renderCalendario();
    </script>
</body>
</html>
